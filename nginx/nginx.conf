worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Correlation id: honour one supplied by the client, otherwise mint nginx's
    # own. The same value reaches the backend, its logs, and the response.
    map $http_x_request_id $icap_request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rid=$icap_request_id rt=$request_time';
    access_log /dev/stdout main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:8080;
        keepalive 16;
    }

    # ── TLS ───────────────────────────────────────────────────
    # TLS 1.2+ only, forward-secret suites. Session tickets are off so a leaked
    # ticket key cannot retroactively decrypt captured sessions.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Content Security Policy ──────────────────────────────────
    # No 'unsafe-inline' for script-src: the frontend image builds with
    # INLINE_RUNTIME_CHUNK=false, so every script is a same-origin file.
    # style-src keeps 'unsafe-inline' because the charting and animation
    # libraries inject <style> elements at runtime.
    # connect-src covers the API plus Firebase Cloud Messaging registration.
    map $host $icap_csp {
        default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com https://fcm.googleapis.com; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests";
    }

    # ── HTTP: redirect everything to HTTPS ────────────────────────────
    server {
        listen 8080;
        listen [::]:8080;

        # Container/LB probes must not be bounced to another scheme.
        location = /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy"}';
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        http2 on;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;

        # HSTS belongs only on the TLS listener; sending it from a plaintext
        # origin is meaningless and browsers ignore it there anyway.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $icap_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;

        location = /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy"}';
        }

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Request-ID $icap_request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # The interactive schema is not registered by the backend in
        # production; refusing it at the edge too means a misconfigured
        # ENVIRONMENT cannot start publishing it silently.
        location ~ ^/(?:docs|redoc|openapi\.json)$ {
            return 404;
        }

        location = /health {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $icap_request_id;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}