version: 2

# Keeps the pinned dependency sets from ageing into known-vulnerable versions
# (OWASP A06). Security updates are raised immediately; routine version bumps
# are batched weekly so the noise stays manageable.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    labels: ["dependencies", "security"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    labels: ["dependencies", "security"]

  - package-ecosystem: docker
    directory: /nginx
    schedule:
      interval: weekly
    labels: ["dependencies", "security"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "security"]
