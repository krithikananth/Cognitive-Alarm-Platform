name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend suite and API coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # The coverage configuration lives in backend/.coveragerc; it scopes the
      # measurement to app/api + app/schemas and fails under 85%.
      - name: Run the full test suite with the coverage gate
        working-directory: backend
        run: python -m pytest -q --cov --cov-report=term-missing

  # tests/test_migrations.py provisions SQLite, which has no enum types and
  # ignores VARCHAR lengths, so a migration can be dialect-invalid and still
  # pass every other job here. This walks the same chain on the engine the
  # deployment actually runs, and is the only place that catches it before
  # `docker compose up`.
  migrations-postgres:
    name: Migrations against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: icap_db
          POSTGRES_USER: icap_user
          POSTGRES_PASSWORD: ci-postgres-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U icap_user -d icap_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://icap_user:ci-postgres-password-not-for-production@localhost:5432/icap_db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Upgrade a clean database to head
        working-directory: backend
        run: python -m alembic upgrade head

      - name: The migrated schema has every table the models declare
        working-directory: backend
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, inspect

          # app.models.__init__ is empty, so importing the package registers
          # nothing; app.main is what pulls in every model module.
          import app.main  # noqa: F401
          from app.db.base import Base

          engine = create_engine(os.environ["DATABASE_URL"])
          present = set(inspect(engine).get_table_names())
          missing = set(Base.metadata.tables) - present
          assert not missing, f"migrations did not create: {sorted(missing)}"
          print(f"{len(present)} tables present, no drift")
          PY

  frontend:
    name: Frontend unit tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run the unit tests
        working-directory: frontend
        env:
          CI: "true"
        run: npx react-scripts test --watchAll=false

      - name: Build the production bundle
        working-directory: frontend
        env:
          CI: "true"
        run: npm run build

  e2e:
    name: Browser end-to-end journeys
    runs-on: ubuntu-latest
    # Boots a real uvicorn backend and a real dev server, then drives them.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # run.js pins PLAYWRIGHT_BROWSERS_PATH to frontend/.playwright-browsers,
      # so the browser must be installed through it or the run would not find it.
      - name: Install the browser
        working-directory: frontend
        run: node e2e/run.js install --with-deps chromium

      - name: Run the journeys
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/.report
            frontend/e2e/.artifacts
          retention-days: 7
