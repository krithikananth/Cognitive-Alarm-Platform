name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend suite and API coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # The coverage configuration lives in backend/.coveragerc; it scopes the
      # measurement to app/api + app/schemas and fails under 85%.
      - name: Run the full test suite with the coverage gate
        working-directory: backend
        run: python -m pytest -q --cov --cov-report=term-missing

  frontend:
    name: Frontend unit tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run the unit tests
        working-directory: frontend
        env:
          CI: "true"
        run: npx react-scripts test --watchAll=false

      - name: Build the production bundle
        working-directory: frontend
        env:
          CI: "true"
        run: npm run build

  e2e:
    name: Browser end-to-end journeys
    runs-on: ubuntu-latest
    # Boots a real uvicorn backend and a real dev server, then drives them.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # run.js pins PLAYWRIGHT_BROWSERS_PATH to frontend/.playwright-browsers,
      # so the browser must be installed through it or the run would not find it.
      - name: Install the browser
        working-directory: frontend
        run: node e2e/run.js install --with-deps chromium

      - name: Run the journeys
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/.report
            frontend/e2e/.artifacts
          retention-days: 7
