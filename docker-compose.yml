name: icap

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-icap_db}
      POSTGRES_USER: ${POSTGRES_USER:-icap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - data

  backend:
    <<: *service-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-icap_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-icap_db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_IP_MAX_ATTEMPTS: ${LOGIN_IP_MAX_ATTEMPTS:-20}
      LOGIN_ATTEMPT_WINDOW_SECONDS: ${LOGIN_ATTEMPT_WINDOW_SECONDS:-300}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
      PASSWORD_RESET_MAX_REQUESTS: ${PASSWORD_RESET_MAX_REQUESTS:-3}
      PASSWORD_RESET_WINDOW_SECONDS: ${PASSWORD_RESET_WINDOW_SECONDS:-900}
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-0.5}
      RECOMMENDATION_CACHE_TTL_SECONDS: ${RECOMMENDATION_CACHE_TTL_SECONDS:-300}
      AGGREGATE_CACHE_ENABLED: ${AGGREGATE_CACHE_ENABLED:-true}
      AGGREGATE_CACHE_TTL_SECONDS: ${AGGREGATE_CACHE_TTL_SECONDS:-30}
      CORS_ORIGINS: '["${PUBLIC_URL:-https://localhost}"]'
      FRONTEND_URL: ${PUBLIC_URL:-https://localhost}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-60}
      EMAIL_VERIFICATION_TOKEN_EXPIRE_HOURS: ${EMAIL_VERIFICATION_TOKEN_EXPIRE_HOURS:-24}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Intelligent Cognitive Alarm}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      OAUTH2_GOOGLE_CLIENT_ID: ${OAUTH2_GOOGLE_CLIENT_ID:-}
      OAUTH2_GOOGLE_CLIENT_SECRET: ${OAUTH2_GOOGLE_CLIENT_SECRET:-}
      OAUTH2_GOOGLE_REDIRECT_URI: ${OAUTH2_GOOGLE_REDIRECT_URI:-https://localhost/api/v1/auth/oauth/google/callback}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_CHALLENGE_ENABLED: ${AI_CHALLENGE_ENABLED:-true}
      AI_CHALLENGE_MODEL: ${AI_CHALLENGE_MODEL:-gemini-1.5-flash}
      AI_CHALLENGE_TIMEOUT_SECONDS: ${AI_CHALLENGE_TIMEOUT_SECONDS:-6}
      AI_CHALLENGE_COOLDOWN_SECONDS: ${AI_CHALLENGE_COOLDOWN_SECONDS:-300}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      NOTIFICATION_PROCESSING_INTERVAL_SECONDS: ${NOTIFICATION_PROCESSING_INTERVAL_SECONDS:-60}
      NOTIFICATION_RETRY_INTERVAL_SECONDS: ${NOTIFICATION_RETRY_INTERVAL_SECONDS:-300}
      NOTIFICATION_MAX_PUSH_ATTEMPTS: ${NOTIFICATION_MAX_PUSH_ATTEMPTS:-3}
      NOTIFICATION_RETRY_BACKOFF_SECONDS: ${NOTIFICATION_RETRY_BACKOFF_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_TO_FILE: ${LOG_TO_FILE:-true}
      LOG_DIR: /app/logs
      LOG_FILE_MAX_BYTES: ${LOG_FILE_MAX_BYTES:-10485760}
      LOG_FILE_BACKUP_COUNT: ${LOG_FILE_BACKUP_COUNT:-5}
      LOG_ACCESS_ENABLED: ${LOG_ACCESS_ENABLED:-true}
      LOG_SQL_LEVEL: ${LOG_SQL_LEVEL:-WARNING}
      METRICS_ALERTS_ENABLED: ${METRICS_ALERTS_ENABLED:-true}
      METRICS_ALERT_INTERVAL_SECONDS: ${METRICS_ALERT_INTERVAL_SECONDS:-60}
      METRICS_ALERT_P95_MS: ${METRICS_ALERT_P95_MS:-400}
      METRICS_ALERT_ERROR_RATE_PCT: ${METRICS_ALERT_ERROR_RATE_PCT:-5}
      METRICS_ALERT_WEBHOOK_URL: ${METRICS_ALERT_WEBHOOK_URL:-}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    # Named volume, so rotated logs survive container replacement even though
    # the root filesystem is read-only.
    volumes:
      - backend_logs:/app/logs
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - application
      - data

  frontend:
    <<: *service-defaults
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api/v1
        REACT_APP_FIREBASE_API_KEY: ${REACT_APP_FIREBASE_API_KEY:-}
        REACT_APP_FIREBASE_AUTH_DOMAIN: ${REACT_APP_FIREBASE_AUTH_DOMAIN:-}
        REACT_APP_FIREBASE_PROJECT_ID: ${REACT_APP_FIREBASE_PROJECT_ID:-}
        REACT_APP_FIREBASE_STORAGE_BUCKET: ${REACT_APP_FIREBASE_STORAGE_BUCKET:-}
        REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${REACT_APP_FIREBASE_MESSAGING_SENDER_ID:-}
        REACT_APP_FIREBASE_APP_ID: ${REACT_APP_FIREBASE_APP_ID:-}
        REACT_APP_FIREBASE_VAPID_KEY: ${REACT_APP_FIREBASE_VAPID_KEY:-}
        # Set to a CDN origin (https://cdn.example.com) to have index.html load
        # the hashed assets from the edge instead of from this container. Empty
        # keeps everything same-origin.
        PUBLIC_URL: ${CDN_BASE_URL:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - frontend

  nginx:
    <<: *service-defaults
    build:
      context: ./nginx
      dockerfile: Dockerfile
      args:
        # Must match the frontend's CDN_BASE_URL, otherwise the CSP blocks the
        # assets index.html points at.
        CDN_ORIGIN: ${CDN_BASE_URL:-}
    environment:
      # Name on the fallback self-signed certificate. Ignored once a CA-issued
      # certificate is mounted over /etc/nginx/tls.
      TLS_COMMON_NAME: ${TLS_COMMON_NAME:-localhost}
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    read_only: true
    # Writable so the entrypoint can drop a self-signed certificate on first
    # run. Replace with a bind mount of real certificates in production.
    volumes:
      - nginx_tls:/etc/nginx/tls
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - public
      - application
      - frontend

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  nginx_tls:

networks:
  public:
    driver: bridge
  application:
    driver: bridge
  frontend:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
