worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

# Loads the brotli filter and brotli_static handlers installed by
# nginx-mod-http-brotli. Without this include the brotli_* directives below are
# unknown and nginx refuses to start, so a missing module fails loudly at boot
# instead of silently degrading every response back to gzip.
include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # ── Compression ────────────────────────────────────────
    # Two layers, in the order nginx tries them:
    #   1. brotli_static / gzip_static serve the .br and .gz siblings that
    #      `npm run build` emits (brotli quality 11, zlib level 9). No CPU is
    #      spent per request and the ratio is the best available.
    #   2. brotli / gzip compress anything without a sibling on the fly, at a
    #      moderate level, so nothing is ever sent uncompressed by accident.
    brotli_static on;
    gzip_static on;

    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    # A shared cache or CDN that ignored the encoding would serve one variant
    # to every client, so compressed responses are keyed on Accept-Encoding.
    # gzip_vary covers the on-the-fly gzip path; this covers brotli and the
    # precompressed static paths, and stays empty for uncompressed responses.
    map $sent_http_content_encoding $icap_vary {
        default "Accept-Encoding";
        ""      "";
    }

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy"}';
        }

        location = /index.html {
            add_header Cache-Control "no-store";
            add_header Vary $icap_vary;
        }

        location = /firebase-messaging-sw.js {
            add_header Cache-Control "no-store";
            add_header Vary $icap_vary;
        }

        # Content-hashed filenames, so these are safe to cache forever in the
        # browser and in any CDN in front of this origin. The CORS headers are
        # what let the identical files be served from a CDN hostname: fonts and
        # module scripts are fetched cross-origin and would otherwise be
        # rejected by the browser.
        location ~* \.(?:css|gif|ico|jpe?g|js|png|svg|webp|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary $icap_vary;
            add_header Access-Control-Allow-Origin "*";
            add_header Timing-Allow-Origin "*";
            add_header X-Content-Type-Options nosniff;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\. {
            deny all;
        }
    }
}